[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "djangoalchemy"
dynamic = ["version"]
description = "Django-style ORM query API on top of SQLAlchemy"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Divyesh Sondagar", email = "divyeshsondagar135@gmail.com" },
]
keywords = ["sqlalchemy", "orm", "django", "query", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["SQLAlchemy>=2.0"]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=8.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/DivyeshSondagar/djangoalchemy"
Source = "https://github.com/DivyeshSondagar/djangoalchemy"
Issues = "https://github.com/DivyeshSondagar/djangoalchemy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
djangoalchemy = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "djangoalchemy.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
